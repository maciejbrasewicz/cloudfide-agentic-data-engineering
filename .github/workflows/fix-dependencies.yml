name: Fix Foundry dependency lockfile
on:
  push:
    branches: [fix/foundry-mcp-runtime-and-faultlab]
    paths:
      - pyproject.toml
      - .github/workflows/fix-dependencies.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          uv lock
          uv sync --locked --extra quality --extra foundry
          uv run --no-sync python -c "import tenacity; from agent_framework import MCPStdioTool; print('MCP tenacity runtime verified')"
      - name: Commit audited lock on repair branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if ! git diff --staged --quiet; then
            git commit -m "Lock missing MCP runtime subscription dependency"
            git push origin HEAD:fix/foundry-mcp-runtime-and-faultlab
          fi
