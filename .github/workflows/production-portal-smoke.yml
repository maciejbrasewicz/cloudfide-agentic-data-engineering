name: Production reviewer portal - live read-only acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "showcase/**"
      - ".github/workflows/production-portal-smoke.yml"
      - "scripts/verify_live_delivery_feed.py"

permissions:
  contents: read

jobs:
  verify-live-site:
    name: Real Railway HTTP smoke (no Azure or reviewer credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify LIVE portal routes only after deployment is online
        shell: bash
        env:
          BASE: https://engineering-intelligence-production-a972180f.up.railway.app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cloudfide-http"
          for n in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 10 \
              "$BASE/data/latest_autonomous_run.json" \
              -o "$RUNNER_TEMP/cloudfide-http/actual-run.json"; then
              if python - "$RUNNER_TEMP/cloudfide-http/actual-run.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          assert d["runId"] == 44485096373
          assert d["reference"]["candidateSha"] == "73ab197159f8ed5a595bdd99a88b01707371d12e"
          assert d["reference"]["ciCommitStatus"] == "success"
          PY
              then break; fi
            fi
            if [ "$n" -eq 24 ]; then echo "Production latest run never became ready"; exit 1; fi
            sleep 10
          done
          curl --fail --silent --show-error --max-time 15 \
            "$BASE/api/delivery/launch/capabilities" \
            -o "$RUNNER_TEMP/cloudfide-http/launcher.json"
          python - "$RUNNER_TEMP/cloudfide-http/launcher.json" <<'PY'
          import json, sys
          obj = json.load(open(sys.argv[1], encoding="utf-8"))
          assert obj["liveReady"] is True, "Railway full delivery token/code missing"
          assert obj["mode"] == "protected_full_three_agent_delivery"
          assert "token" not in str(obj).lower()
          print("Public capability ready without exposing credentials")
          PY
      - name: Verify deployed recruiter-first layout and actual 5-run protected gateway
        shell: bash
        env:
          BASE: https://engineering-intelligence-production-a972180f.up.railway.app
        run: |
          set -euo pipefail
          # The GitHub push can precede Railway's redeploy. Read LIVE HTML,
          # never mistake the old still-running version for this release.
          for n in $(seq 1 30); do
            curl --fail --silent --show-error --max-time 12 "$BASE/" \
              -o "$RUNNER_TEMP/cloudfide-http/portal.html"
            if python - "$RUNNER_TEMP/cloudfide-http/portal.html" <<'PY'
          from pathlib import Path
          import sys
          html=Path(sys.argv[1]).read_text(encoding="utf-8")
          assert html.index('id="intro"') < html.index('id="reviewer-execution"') < html.index('class="container hero-system-section"')
          assert 'id="technical-job-steps"' in html
          assert 'id="technical-run-outcome"' in html
          assert 'id="technical-run-explainer"' in html
          assert 'header-launch-action' not in html
          assert 'Uruchom agentów na zadaniu' in html
          PY
            then break; fi
            if [ "$n" -eq 30 ]; then echo "New recruiter UI not deployed on Railway"; exit 1; fi
            sleep 10
          done
          curl --fail --silent --show-error --max-time 12 \
            "$BASE/api/delivery/launch/capabilities" \
            -o "$RUNNER_TEMP/cloudfide-http/recruiter-capabilities.json"
          python - "$RUNNER_TEMP/cloudfide-http/recruiter-capabilities.json" <<'PY'
          import json,sys
          c=json.load(open(sys.argv[1],encoding="utf-8"))
          assert c["liveReady"] is True
          assert c["maxRunsPerDay"] == 5
          assert c["maxConcurrentRuns"] == 1
          assert c["mode"] == "protected_full_three_agent_delivery"
          assert "token" not in str(c).lower()
          print("Production reviewer entry and bounded protected launch verified")
          PY
      - name: Actually rerun independent original CSV arithmetic through production API
        shell: bash
        env:
          BASE: https://engineering-intelligence-production-a972180f.up.railway.app
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            --retry 2 --retry-delay 3 \
            -X POST -H 'Content-Type: application/json' \
            --data '{}' "$BASE/api/review/recalculate" \
            -o "$RUNNER_TEMP/cloudfide-http/recalculation.json"
          python - "$RUNNER_TEMP/cloudfide-http/recalculation.json" <<'PY'
          import json,sys
          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          assert doc["status"] == "PASSED"
          assert doc["agentRunExecuted"] is False
          assert doc["netRevenue"] == "2570247.03"
          assert doc["sourceCounts"]["rawRows"] == 1507
          assert doc["sourceCounts"]["uniqueTransactions"] == 1500
          assert set(doc["regions"]) == {"Central", "East", "North", "South", "West"}
          assert doc["sourceSha256"] == "811573152aa287b14d5006ce6901ebd0ca17586149e16a5b79de5ae69684c1d4"
          print("Verified immutable original CSV and five revenue regions")
          PY
      - name: Check live GitHub delivery and fail closed on unsupported verification claims
        shell: bash
        env:
          BASE: https://engineering-intelligence-production-a972180f.up.railway.app
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            "$BASE/api/delivery/latest" \
            -o "$RUNNER_TEMP/cloudfide-http/latest.json"
          # Latest means latest, not always the historical successful run #44485096373.
          # Reject false verified claims; ongoing and genuinely unverified runs remain honest.
          python scripts/verify_live_delivery_feed.py "$RUNNER_TEMP/cloudfide-http/latest.json"
      - name: Publish privacy-safe run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Railway production verification"
            echo
            echo "- Actual HTTP calls to production (not mocked)"
            echo "- Read-only GitHub latest/CI retrieval"
            echo "- No GitHub API token or review code logged"
            echo "- Recalculation independently performed on the server"
          } >> "$GITHUB_STEP_SUMMARY"


  replay-published-candidate:
    name: Independently replay the ACTUAL model candidate in Docker, not root Python
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only trusted pinned source verification dependencies
        run: uv sync --locked --extra quality
      - name: Replay source on the exact PR #35 SHA using no-network Docker
        run: |
          uv run --no-sync python scripts/replay_delivery.py \
            --run-id 44485096373 \
            --commit 73ab197159f8ed5a595bdd99a88b01707371d12e \
            --base 737baf62ad7fb17f89a194a4dcb904bf0081ceea \
            --evidence-dir reviewer-evidence
      - name: Verify actual replay oracle and candidate tests
        run: |
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path("reviewer-evidence/verification.json").read_text())
          assert d["status"]=="PASSED"
          assert d["reconciliation"]=="passed"
          assert d["net_revenue"]=="2570247.03"
          assert len(d["regions"])==5
          assert d["sandbox_network"]=="disabled"
          assert d["sandbox_test_exit_code"]==0
          assert d["sandbox_pipeline_exit_code"]==0
          tests=pathlib.Path("reviewer-evidence/tests.log").read_text()
          assert "passed" in tests and "failed" not in tests
          print("Verified independent exact-SHA Docker replay with P3 Decimal oracle")
          PY
      - name: Preserve exact isolated candidate replay proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-exact-sha-docker-replay
          path: reviewer-evidence/
          retention-days: 14
          if-no-files-found: warn
