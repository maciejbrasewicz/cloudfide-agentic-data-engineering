name: Showcase - evidence integrity and syntax

on:
  push:
    paths:
      - "showcase/**"
      - "tests/test_showcase_evidence.py"
      - ".github/workflows/showcase-ci.yml"
  pull_request:
    paths:
      - "showcase/**"
      - "tests/test_showcase_evidence.py"
      - ".github/workflows/showcase-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate client JavaScript syntax
        run: |
          node --check showcase/app.js
          node --check showcase/trace.js
          node --check showcase/fault.js
          node --check showcase/server.mjs
          node --test showcase/server.test.mjs
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked deterministic dependencies
        run: uv sync --locked --extra quality
      - name: Verify every published claim against committed evidence
        run: uv run --no-sync python -m pytest tests/test_showcase_evidence.py
      - name: Render visual regression snapshots
        shell: bash
        run: |
          set -euo pipefail
          node showcase/server.mjs &
          SITE_PID=$!
          trap 'kill "$SITE_PID" 2>/dev/null || true' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:4173/data/evidence.json > /dev/null
          BROWSER="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then
            echo "Chrome/Chromium unavailable for visual rendering" >&2
            exit 1
          fi
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=4500 --window-size=1600,1000 --screenshot="$PWD/engineering-desktop.png" http://127.0.0.1:4173/
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=4500 --window-size=430,900 --screenshot="$PWD/engineering-mobile.png" http://127.0.0.1:4173/
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=5000 --window-size=1600,1100 --screenshot="$PWD/engineering-execution.png" 'http://127.0.0.1:4173/#execution'
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=5000 --window-size=430,900 --screenshot="$PWD/engineering-execution-mobile.png" 'http://127.0.0.1:4173/#execution'
          test -s engineering-desktop.png
          test -s engineering-mobile.png
          test -s engineering-execution.png
          test -s engineering-execution-mobile.png
      - name: Upload visual QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: engineering-intelligence-visual-qa
          path: |
            engineering-desktop.png
            engineering-mobile.png
            engineering-execution.png
            engineering-execution-mobile.png
          retention-days: 7
      - name: Verify ETL source files have not been touched
        run: git status --short
