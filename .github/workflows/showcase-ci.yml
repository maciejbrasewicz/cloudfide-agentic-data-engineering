name: Case study - real Foundry evidence and bilingual UI

on:
  push:
    paths:
      - "showcase/**"
      - "tests/test_showcase_evidence.py"
      - ".github/workflows/showcase-ci.yml"
  pull_request:
    paths:
      - "showcase/**"
      - "tests/test_showcase_evidence.py"
      - ".github/workflows/showcase-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate client syntax and real HTTP response
        run: |
          node --check showcase/app.js
          node --check showcase/server.mjs
          node --test showcase/server.test.mjs
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked deterministic dependencies
        run: uv sync --locked --extra quality
      - name: Verify publication against original Foundry and ETL evidence
        run: uv run --no-sync python -m pytest tests/test_showcase_evidence.py
      - name: Browser smoke test in Polish and English with visual evidence
        shell: bash
        run: |
          set -euo pipefail
          node showcase/server.mjs &
          SITE_PID=$!
          trap 'kill "$SITE_PID" 2>/dev/null || true' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:4173/data/foundry_reports.json > /dev/null
          BROWSER="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then
            echo "Chrome/Chromium unavailable" >&2
            exit 1
          fi
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=5500 --dump-dom 'http://127.0.0.1:4173/?lang=pl' > polish-dom.html
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=5500 --dump-dom 'http://127.0.0.1:4173/?lang=en' > english-dom.html
          grep -q 'Zadanie Data Engineering' polish-dom.html
          grep -q 'A Data Engineering assignment' english-dom.html
          grep -q '79 tests' english-dom.html
          grep -q 'Data Architect' english-dom.html
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=5500 --window-size=1600,1000 --screenshot="$PWD/case-study-desktop-pl.png" 'http://127.0.0.1:4173/?lang=pl'
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=5500 --window-size=1600,1000 --screenshot="$PWD/case-study-desktop-en.png" 'http://127.0.0.1:4173/?lang=en'
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=5500 --window-size=430,930 --screenshot="$PWD/case-study-mobile-pl.png" 'http://127.0.0.1:4173/?lang=pl'
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=5500 --window-size=430,930 --screenshot="$PWD/case-study-mobile-en.png" 'http://127.0.0.1:4173/?lang=en'
          test -s case-study-desktop-pl.png
          test -s case-study-desktop-en.png
          test -s case-study-mobile-pl.png
          test -s case-study-mobile-en.png
      - name: Upload desktop and mobile visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-foundry-case-study-visuals
          path: |
            case-study-desktop-pl.png
            case-study-desktop-en.png
            case-study-mobile-pl.png
            case-study-mobile-en.png
          retention-days: 7
      - name: Check working tree
        run: git status --short
