name: Public case study - unified system and real evidence

on:
  push:
    paths:
      - "showcase/**"
      - "tests/test_showcase_evidence.py"
      - ".github/workflows/showcase-ci.yml"
  pull_request:
    paths:
      - "showcase/**"
      - "tests/test_showcase_evidence.py"
      - ".github/workflows/showcase-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate syntax, real HTTP server, launch controls and signed OIDC
        run: |
          node --check showcase/app.js
          node --check showcase/technical.js
          node --check showcase/live_gateway.mjs
          node --check showcase/server.mjs
          node --test showcase/server.test.mjs showcase/live_gateway.test.mjs
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked deterministic dependencies
        run: uv sync --locked --extra quality
      - name: Verify source-grounded publication and one-portal policy
        run: uv run --no-sync python -m pytest tests/test_showcase_evidence.py
      - name: Chromium PL / EN, original Foundry evidence, desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          node showcase/server.mjs &
          SITE_PID=$!
          trap 'kill "$SITE_PID" 2>/dev/null || true' EXIT
          sleep 2
          BROWSER="$(command -v google-chrome || command -v chromium || true)"
          test -n "$BROWSER"
          curl --fail --silent --show-error http://127.0.0.1:4173/data/foundry_reports.json > /dev/null
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=6500 --dump-dom 'http://127.0.0.1:4173/?lang=pl' > site-pl.html
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=6500 --dump-dom 'http://127.0.0.1:4173/?lang=en' > site-en.html
          grep -q 'Warstwa techniczna systemu' site-pl.html
          grep -q 'Technical implementation' site-en.html
          grep -q 'Uruchomienie workflow Microsoft Foundry' site-pl.html
          grep -q 'Execute Microsoft Foundry workflow' site-en.html
          grep -q 'Source profiling confirms 1,507 rows' site-en.html
          grep -q 'DataDecision' site-pl.html
          grep -q 'run-foundry-absent-marker' site-pl.html && exit 1 || true
          if grep -Eiq 'ChatGPT|Engineering Lab' site-pl.html; then
            echo 'Unprofessional legacy copy leaked into unified experience' >&2
            exit 1
          fi
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=6500 --window-size=1600,1050 --screenshot="$PWD/unified-desktop-pl.png" 'http://127.0.0.1:4173/?lang=pl'
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=6500 --window-size=1600,1050 --screenshot="$PWD/unified-desktop-en.png" 'http://127.0.0.1:4173/?lang=en'
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=6500 --window-size=430,930 --screenshot="$PWD/unified-mobile-pl.png" 'http://127.0.0.1:4173/?lang=pl'
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=6500 --window-size=430,930 --screenshot="$PWD/unified-mobile-en.png" 'http://127.0.0.1:4173/?lang=en'
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=6500 --window-size=1600,1200 --screenshot="$PWD/technical-section-pl.png" 'http://127.0.0.1:4173/?lang=pl#technical'
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=6500 --window-size=1600,1200 --screenshot="$PWD/recorded-foundry-en.png" 'http://127.0.0.1:4173/?lang=en#execution'
          test -s unified-desktop-pl.png
          test -s unified-desktop-en.png
          test -s unified-mobile-pl.png
          test -s unified-mobile-en.png
          test -s technical-section-pl.png
          test -s recorded-foundry-en.png
      - name: Attach visual regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: unified-foundry-engineering-portal-visuals
          path: |
            unified-desktop-pl.png
            unified-desktop-en.png
            unified-mobile-pl.png
            unified-mobile-en.png
            technical-section-pl.png
            recorded-foundry-en.png
          retention-days: 7
      - name: Check tree
        run: git status --short
