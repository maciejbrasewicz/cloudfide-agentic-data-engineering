            cp "$RUNNER_TEMP/cloudfide-sandbox-r3-output"/pipeline_exit_code.txt sandbox-r3-evidence/ 2>/dev/null || true
            cp "$RUNNER_TEMP/cloudfide-sandbox-r3-output"/tests.log sandbox-r3-evidence/ 2>/dev/null || true
            cp "$RUNNER_TEMP/cloudfide-sandbox-r3-output"/pipeline.log sandbox-r3-evidence/ 2>/dev/null || true
            cp "$RUNNER_TEMP/cloudfide-sandbox-r3-output"/revenue_by_region.csv sandbox-r3-evidence/ 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v4
