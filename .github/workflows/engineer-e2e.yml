          if [ -d "$RUNNER_TEMP/cloudfide-sandbox-r2-output" ]; then
            cp "$RUNNER_TEMP/cloudfide-sandbox-r2-output"/test_exit_code.txt sandbox-r2-evidence/ 2>/dev/null || true
            cp "$RUNNER_TEMP/cloudfide-sandbox-r2-output"/pipeline_exit_code.txt sandbox-r2-evidence/ 2>/dev/null || true
            cp "$RUNNER_TEMP/cloudfide-sandbox-r2-output"/tests.log sandbox-r2-evidence/ 2>/dev/null || true
            cp "$RUNNER_TEMP/cloudfide-sandbox-r2-output"/pipeline.log sandbox-r2-evidence/ 2>/dev/null || true
            cp "$RUNNER_TEMP/cloudfide-sandbox-r2-output"/revenue_by_region.csv sandbox-r2-evidence/ 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5-sandbox-r2-validation
          path: sandbox-r2-evidence/*
          if-no-files-found: warn
          retention-days: 30

  rework-r3:
    name: Data Engineer third and final evidence-driven correction (iteration 3)
    needs: [architect, rework-r2, sandbox-rework-r2]
    if: ${{ always() && fromJSON(inputs.max_rounds || '3') >= 3 && needs.architect.result == 'success' && needs['rework-r2'].result == 'success' && needs['sandbox-rework-r2'].outputs.candidate_status == 'FAILED' }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    permissions:
      contents: read
      id-token: write
    env:
      FOUNDRY_PROJECT_ENDPOINT: https://registry9-claude-resource.services.ai.azure.com/api/projects/registry9-claude
      FOUNDRY_MODEL: gpt-5.6-sol
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: p2-architect-receipt
          path: architect-evidence
      - uses: actions/download-artifact@v4
        with:
          name: p5-engineer-rework-r2
          path: previous-engineer-evidence
      - uses: actions/download-artifact@v4
        with:
          name: p5-sandbox-r2-validation
          path: previous-p3-evidence
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Foundry code and security checks
