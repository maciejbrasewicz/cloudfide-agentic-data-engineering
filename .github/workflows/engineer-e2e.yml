          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5-sandbox-r2-validation
          path: sandbox-r2-evidence/*
          if-no-files-found: warn
          retention-days: 30

  rework-r3:
    name: Data Engineer third and final evidence-driven correction (iteration 3)
    needs: [architect, rework-r2, sandbox-rework-r2]
    if: ${{ always() && needs.architect.result == 'success' && needs['rework-r2'].result == 'success' && needs['sandbox-rework-r2'].outputs.candidate_status == 'FAILED' }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    permissions:
