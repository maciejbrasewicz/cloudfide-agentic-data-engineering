        id: verdict
        shell: bash
        if: always()
        run: |
          status=INFRA_FAILURE
          if [ -f sandbox-r3-evidence/verification.json ]; then
            candidate=$(python -c "import json;print(json.load(open('sandbox-r3-evidence/verification.json'))['status'])")
