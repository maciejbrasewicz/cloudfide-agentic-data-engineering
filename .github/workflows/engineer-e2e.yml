      - name: Admit only SHA-matched P2 files and original source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sandbox-r3-evidence
          uv run --no-sync python -m agentic.candidate_intake \
            --archive rework-r3-evidence/candidate_bundle.zip \
            --gate rework-r3-evidence/engineer_gate.json \
            --request rework-r3-evidence/validation_request.json \
            --original . \
            --destination "$RUNNER_TEMP/cloudfide-sandbox-r3-input" \
            --receipt sandbox-r3-evidence/admission.json
      - name: Build static, pinned container from trusted code only
        shell: bash
        run: |
          set -euo pipefail
          docker build -f sandbox/Dockerfile -t cloudfide-p3-sandbox:verified sandbox
      - name: Execute model-written candidate without network, secrets or host write access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cloudfide-sandbox-r3-output"
          chmod 0777 "$RUNNER_TEMP/cloudfide-sandbox-r3-output"
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 128 \
            --memory 768m \
            --cpus 1.5 \
            --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777,size=128m \
            --volume "$RUNNER_TEMP/cloudfide-sandbox-r3-input:/input:ro" \
            --volume "$RUNNER_TEMP/cloudfide-sandbox-r3-output:/out:rw" \
            cloudfide-p3-sandbox:verified
      - name: Independently recompute output from original CSV using stdlib Decimal
        shell: bash
        run: |
          set +e
          set -uo pipefail
          uv run --no-sync python -m agentic.p3_oracle \
            --source sales.csv \
            --sandbox-output "$RUNNER_TEMP/cloudfide-sandbox-r3-output" \
            --receipt sandbox-r3-evidence/verification.json
          result=$?
          printf "%s\n" "$result" > sandbox-r3-evidence/oracle_exit_code.txt
          # A genuine candidate failure is feedback, not infrastructure failure.
