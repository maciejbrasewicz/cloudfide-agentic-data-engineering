          name: p5-engineer-rework-r3
          path: rework-evidence/*
          if-no-files-found: warn
          retention-days: 30

  sandbox-rework-r3:
    name: Verify final P5 round-3 candidate in independent sandbox
    outputs:
      candidate_status: ${{ steps.verdict.outputs.status }}
    needs: rework-r3
    if: ${{ always() && needs['rework-r3'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: p5-engineer-rework-r3
          path: rework-r3-evidence
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install trusted P3 verification tools, never generated code
