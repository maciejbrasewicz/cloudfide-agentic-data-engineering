name: CloudFide - autonomous Data Engineering delivery

# Trusted main only; no candidate Python is executed in an Azure/OIDC job.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Rebuild from original fixtures or improve allowlisted baseline"
        type: choice
        required: true
        default: rebuild
        options:
          - rebuild
          - improve
      max_rounds:
        description: "Maximum independent candidate iterations (1-3)"
        type: choice
        required: true
        default: "3"
        options:
          - "1"
          - "2"
          - "3"
      publish_draft_pr:
        description: "After P4 independent PASS, publish verified draft PR (never merge)"
        type: boolean
        required: true
        default: true
  push:
    branches: [main]
    paths:
      - ".github/workflows/engineer-e2e.yml"
      - "agentic/engineer.py"
      - "agentic/rework.py"
      - "agentic/verifier.py"
      - "agentic/verifier_gate.py"
      - "agentic/verifier_intake.py"
      - "agentic/verifier_verdict.py"
      - "tests/test_verifier_gate.py"
      - "tests/test_rework.py"
      - "agentic/workspace.py"
      - "agentic/engineer_gate.py"
      - "agentic/patch_policy.py"
      - "agentic/schemas/engineer.py"
      - "tests/test_engineer_gate.py"
      - "tests/test_workspace_security.py"

concurrency:
  group: cloudfide-engineer-p2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  architect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
      id-token: write
    env:
      FOUNDRY_PROJECT_ENDPOINT: https://registry9-claude-resource.services.ai.azure.com/api/projects/registry9-claude
      FOUNDRY_MODEL: gpt-5.6-sol
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Foundry dependencies
        run: uv sync --locked --extra quality --extra foundry
      - name: Verify P1 and P2 deterministic gates
        run: |
          uv run --no-sync python -m ruff check agentic tests
          uv run --no-sync python -m pytest tests/test_architect_contract.py tests/test_workspace_security.py tests/test_engineer_gate.py
      - name: Azure OIDC main-branch authentication
        uses: azure/login@v2
        with:
          client-id: 459e0c31-5a4c-40b0-88d4-4f521ead55fc
          tenant-id: 2fcd0468-9e97-4247-a52a-a7bc870ef450
          allow-no-subscriptions: true
      - name: Run actual original-task Architect and approve evidence
        env:
          CLOUDFIDE_TASK_SPEC_B64: ${{ secrets.CLOUDFIDE_TASK_SPEC_B64 }}
        run: uv run --no-sync python -m agentic.architect --mode "${{ inputs.mode || 'rebuild' }}" --output-dir architect-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-architect-receipt
          path: architect-evidence/*.json
          retention-days: 30
          if-no-files-found: warn

  engineer:
    needs: architect
    if: needs.architect.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    permissions:
      contents: read
      id-token: write
    env:
      FOUNDRY_PROJECT_ENDPOINT: https://registry9-claude-resource.services.ai.azure.com/api/projects/registry9-claude
      FOUNDRY_MODEL: gpt-5.6-sol
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: p2-architect-receipt
          path: architect-evidence
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Foundry dependencies
        run: uv sync --locked --extra quality --extra foundry
      - name: Azure OIDC main-branch authentication
        uses: azure/login@v2
        with:
          client-id: 459e0c31-5a4c-40b0-88d4-4f521ead55fc
          tenant-id: 2fcd0468-9e97-4247-a52a-a7bc870ef450
          allow-no-subscriptions: true
      - name: Foundry Engineer writes REAL candidate source (never executes it)
        env:
          CLOUDFIDE_TASK_SPEC_B64: ${{ secrets.CLOUDFIDE_TASK_SPEC_B64 }}
        run: |
          uv run --no-sync python -m agentic.engineer \
            --architect-dir architect-evidence \
            --mode "${{ inputs.mode || 'rebuild' }}" \
            --output-dir engineer-evidence
      - name: Publish P2 candidate and verified write receipts for P3 sandbox
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-engineer-candidate-pending-sandbox
          path: engineer-evidence/*
          retention-days: 30
          if-no-files-found: warn

  sandbox-validate:
    name: Verify P2 code inside no-network, no-secret Docker sandbox
    outputs:
      candidate_status: ${{ steps.verdict.outputs.status }}
    needs: engineer
    if: needs.engineer.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: p2-engineer-candidate-pending-sandbox
          path: engineer-evidence
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install trusted P3 verification tools, never generated code
        run: uv sync --locked --extra quality
      - name: Prove archive admission and stdlib oracle failure modes
        run: |
          uv run --no-sync python -m pytest tests/test_candidate_intake.py tests/test_p3_oracle.py
          uv run --no-sync python -m ruff check agentic/candidate_intake.py agentic/p3_oracle.py
      - name: Admit only SHA-matched P2 files and original source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sandbox-evidence
          uv run --no-sync python -m agentic.candidate_intake \
            --archive engineer-evidence/candidate_bundle.zip \
            --gate engineer-evidence/engineer_gate.json \
            --request engineer-evidence/validation_request.json \
            --original . \
            --destination "$RUNNER_TEMP/cloudfide-sandbox-input" \
            --receipt sandbox-evidence/admission.json
      - name: Build static, pinned container from trusted code only
        shell: bash
        run: |
          set -euo pipefail
          docker build -f sandbox/Dockerfile -t cloudfide-p3-sandbox:verified sandbox
      - name: Execute model-written candidate without network, secrets or host write access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cloudfide-sandbox-output"
          chmod 0777 "$RUNNER_TEMP/cloudfide-sandbox-output"
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 128 \
            --memory 768m \
            --cpus 1.5 \
            --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777,size=128m \
            --volume "$RUNNER_TEMP/cloudfide-sandbox-input:/input:ro" \
            --volume "$RUNNER_TEMP/cloudfide-sandbox-output:/out:rw" \
            cloudfide-p3-sandbox:verified
      - name: Independently recompute output from original CSV using stdlib Decimal
        shell: bash
        run: |
          set +e
          set -uo pipefail
          uv run --no-sync python -m agentic.p3_oracle \
            --source sales.csv \
            --sandbox-output "$RUNNER_TEMP/cloudfide-sandbox-output" \
            --receipt sandbox-evidence/verification.json
          result=$?
          printf "%s\n" "$result" > sandbox-evidence/oracle_exit_code.txt
          # A genuine candidate failure is feedback, not infrastructure failure.
          # The trusted controller decides whether the next round is required.
          exit 0
      - name: Classify exact candidate verdict
        id: verdict
        shell: bash
        if: always()
        run: |
          status=INFRA_FAILURE
          if [ -f sandbox-evidence/verification.json ]; then
            candidate=$(python -c "import json;print(json.load(open('sandbox-evidence/verification.json'))['status'])")
            if [ "$candidate" = "PASSED" ] || [ "$candidate" = "FAILED" ]; then status="$candidate"; fi
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Independent P3 candidate result: $status" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve measured evidence for human review
        if: always()
        shell: bash
        run: |
          mkdir -p sandbox-evidence
          if [ -d "$RUNNER_TEMP/cloudfide-sandbox-output" ]; then
            cp "$RUNNER_TEMP/cloudfide-sandbox-output"/test_exit_code.txt sandbox-evidence/ 2>/dev/null || true
            cp "$RUNNER_TEMP/cloudfide-sandbox-output"/pipeline_exit_code.txt sandbox-evidence/ 2>/dev/null || true
            cp "$RUNNER_TEMP/cloudfide-sandbox-output"/tests.log sandbox-evidence/ 2>/dev/null || true
            cp "$RUNNER_TEMP/cloudfide-sandbox-output"/pipeline.log sandbox-evidence/ 2>/dev/null || true
            cp "$RUNNER_TEMP/cloudfide-sandbox-output"/revenue_by_region.csv sandbox-evidence/ 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-independent-sandbox-validation
          path: sandbox-evidence/*
          if-no-files-found: warn
          retention-days: 30


  rework-r2:
    name: Data Engineer repairs actual P3 failing tests (iteration 2)
    needs: [architect, engineer, sandbox-validate]
    if: ${{ always() && fromJSON(inputs.max_rounds || '3') >= 2 && needs.architect.result == 'success' && needs.engineer.result == 'success' && needs['sandbox-validate'].outputs.candidate_status == 'FAILED' }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    permissions:
      contents: read
      id-token: write
    env:
      FOUNDRY_PROJECT_ENDPOINT: https://registry9-claude-resource.services.ai.azure.com/api/projects/registry9-claude
      FOUNDRY_MODEL: gpt-5.6-sol
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: p2-architect-receipt
          path: architect-evidence
      - uses: actions/download-artifact@v4
        with:
          name: p2-engineer-candidate-pending-sandbox
          path: previous-engineer-evidence
      - uses: actions/download-artifact@v4
        with:
          name: p3-independent-sandbox-validation
          path: previous-p3-evidence
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Foundry code and security checks
        run: uv sync --locked --extra quality --extra foundry
      - name: Verify rework-gate and retry protections
        run: |
          uv run --no-sync python -m pytest tests/test_rework.py
          uv run --no-sync python -m ruff check agentic/rework.py tests/test_rework.py
      - name: Authenticate only trusted Engineer with Azure OIDC
        uses: azure/login@v2
        with:
          client-id: 459e0c31-5a4c-40b0-88d4-4f521ead55fc
          tenant-id: 2fcd0468-9e97-4247-a52a-a7bc870ef450
          allow-no-subscriptions: true
      - name: Real Engineer reads previous source and failure, writes corrected files
        env:
          CLOUDFIDE_TASK_SPEC_B64: ${{ secrets.CLOUDFIDE_TASK_SPEC_B64 }}
        run: |
          uv run --no-sync python -m agentic.rework \
            --iteration 2 \
            --previous-engineer-dir previous-engineer-evidence \
            --p3-dir previous-p3-evidence \
            --architect-dir architect-evidence \
            --output-dir rework-evidence
      - name: Publish second candidate and cryptographic rework lineage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-engineer-rework-r2
          path: rework-evidence/*
          if-no-files-found: warn
          retention-days: 30

  sandbox-rework-r2:
    name: Verify corrected P5 round-2 code in independent sandbox
    outputs:
      candidate_status: ${{ steps.verdict.outputs.status }}
    needs: rework-r2
    if: ${{ always() && needs['rework-r2'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: p5-engineer-rework-r2
          path: rework-evidence
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install trusted P3 verification tools, never generated code
        run: uv sync --locked --extra quality
      - name: Prove archive admission and stdlib oracle failure modes
        run: |
          uv run --no-sync python -m pytest tests/test_candidate_intake.py tests/test_p3_oracle.py
          uv run --no-sync python -m ruff check agentic/candidate_intake.py agentic/p3_oracle.py
      - name: Admit only SHA-matched P2 files and original source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sandbox-r2-evidence
          uv run --no-sync python -m agentic.candidate_intake \
            --archive rework-evidence/candidate_bundle.zip \
            --gate rework-evidence/engineer_gate.json \
            --request rework-evidence/validation_request.json \
            --original . \
            --destination "$RUNNER_TEMP/cloudfide-sandbox-r2-input" \
            --receipt sandbox-r2-evidence/admission.json
      - name: Build static, pinned container from trusted code only
        shell: bash
        run: |
          set -euo pipefail
          docker build -f sandbox/Dockerfile -t cloudfide-p3-sandbox:verified sandbox
      - name: Execute model-written candidate without network, secrets or host write access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cloudfide-sandbox-r2-output"
          chmod 0777 "$RUNNER_TEMP/cloudfide-sandbox-r2-output"
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 128 \
            --memory 768m \
            --cpus 1.5 \
            --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777,size=128m \
            --volume "$RUNNER_TEMP/cloudfide-sandbox-r2-input:/input:ro" \
            --volume "$RUNNER_TEMP/cloudfide-sandbox-r2-output:/out:rw" \
            cloudfide-p3-sandbox:verified
