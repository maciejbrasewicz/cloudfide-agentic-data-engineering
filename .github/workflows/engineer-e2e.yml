            cp "$RUNNER_TEMP/cloudfide-sandbox-r2-output"/pipeline_exit_code.txt sandbox-r2-evidence/ 2>/dev/null || true
            cp "$RUNNER_TEMP/cloudfide-sandbox-r2-output"/tests.log sandbox-r2-evidence/ 2>/dev/null || true
            cp "$RUNNER_TEMP/cloudfide-sandbox-r2-output"/pipeline.log sandbox-r2-evidence/ 2>/dev/null || true
