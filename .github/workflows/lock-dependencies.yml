name: Update locked Pandera dependencies (isolated feature branch)
on:
  push:
    branches: [feature/foundry-engineering-lab-live]
    paths:
      - pyproject.toml
      - .github/workflows/lock-dependencies.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    if: github.ref == 'refs/heads/feature/foundry-engineering-lab-live'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve Pandera without touching reviewed Foundry SDK pin
        run: uv lock
      - name: Check resolution
        run: |
          uv tree --locked --depth 1
          grep -q 'name = "pandera"' uv.lock
      - name: Commit precise lockfile on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if ! git diff --staged --quiet; then
            git commit -m "Lock Pandera runtime and transitive dependencies"
            git push origin HEAD:feature/foundry-engineering-lab-live
          fi
