name: Foundry - autonomous regression author with human PR gate

on:
  workflow_dispatch:

concurrency:
  group: cloudfide-regression-author
  cancel-in-progress: false

jobs:
  propose:
    name: Microsoft Foundry writes a bounded new test proposal
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      id-token: write
    env:
      FOUNDRY_PROJECT_ENDPOINT: https://registry9-claude-resource.services.ai.azure.com/api/projects/registry9-claude
      FOUNDRY_MODEL: gpt-5.6-sol
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked Foundry dependencies
        run: uv sync --locked --extra quality --extra foundry
      - name: Authenticate to Azure using trusted main-branch OIDC
        uses: azure/login@v2
        with:
          client-id: 459e0c31-5a4c-40b0-88d4-4f521ead55fc
          tenant-id: 2fcd0468-9e97-4247-a52a-a7bc870ef450
          allow-no-subscriptions: true
      - name: Foundry agent generates machine-validated code proposal
        run: uv run --no-sync python -m agentic.coding_proposal --generate --output agent_code_proposal.json
      - name: Publish untrusted source for isolated validation
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-code-proposal
          path: agent_code_proposal.json
          if-no-files-found: error
          retention-days: 90

  validate:
    name: Execute proposed regression only on a secret-free, read-only runner
    needs: propose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: autonomous-code-proposal
          path: /tmp/agent-code
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked test dependencies
        run: uv sync --locked --extra quality
      - name: Validate generated code's path, model schema and syntax before any execution
        run: uv run --no-sync python -m agentic.coding_proposal --validate-only /tmp/agent-code/agent_code_proposal.json --root .
      - name: Run generated regression in isolated unprivileged CI
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          FOUNDRY_PROJECT_ENDPOINT: ""
        run: |
          uv run --no-sync python -m ruff check tests/test_agent_generated_regression.py
          uv run --no-sync python -m pytest tests/test_agent_generated_regression.py
          uv run --no-sync python -m pytest
          git diff --exit-code -- solution.py pipeline.py contracts/data_policy.json sales.csv
      - name: Publish only verified new test file for separate human PR
        uses: actions/upload-artifact@v4
        with:
          name: validated-agent-test
          path: tests/test_agent_generated_regression.py
          if-no-files-found: error
          retention-days: 90

  propose-human-review:
    name: Open DRAFT PR; human review required before any merge
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      id-token: none
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: validated-agent-test
          path: /tmp/new-test
      - name: Publish only allowed, already validated test in isolated branch
        shell: bash
        run: |
          set -euo pipefail
          branch="agent-regression-proposal/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          test ! -e tests/test_agent_generated_regression.py
          install -m 0644 /tmp/new-test/test_agent_generated_regression.py tests/test_agent_generated_regression.py
          git add -- tests/test_agent_generated_regression.py
          git commit -m "Propose AI-generated verified regression test (human approval required)"
          git push --set-upstream origin "$branch"
          GH_TOKEN="$GITHUB_TOKEN" gh pr create --draft --base main --head "$branch" \
            --title "Foundry code author: proposed regression test · run ${GITHUB_RUN_ID}" \
            --body "Generated by Microsoft Foundry with read-only source tools. Validated on an isolated runner with no Azure or write-scoped token, passed Ruff and pytest. **Human review required**: this is a DRAFT pull request and cannot be merged automatically. Source workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
        env:
          GITHUB_TOKEN: ${{ github.token }}
