name: Engineering Intelligence - publish evidence experience
on:
  push:
    branches: [main]
    paths:
      - "showcase/**"
      - ".github/workflows/showcase-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: engineering-intelligence-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public evidence JSON
        run: python -m json.tool showcase/data/evidence.json > /dev/null
      - name: Validate JavaScript syntax
        run: node --check showcase/app.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static evidence site
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase
      - name: Publish verified site
        id: deployment
        uses: actions/deploy-pages@v4
