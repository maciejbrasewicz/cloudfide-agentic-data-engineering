name: Foundry - evidence-bound multiagent review

# Changes to the audited engineering deliverable trigger bounded read-only AI review.
# workflow_dispatch stays available for deliberate replay.
# Only main can exchange an OIDC token (matching the project-scoped Entra credential).
on:
  workflow_dispatch:
    inputs:
      live_request_id:
        description: "Optional validated UUID issued by the portal (no secrets)"
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-review.yml"
      - "agentic/**"
      - "contracts/**"
      - "solution.py"
      - "pipeline.py"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"

run-name: 'Foundry review · ${{ inputs.live_request_id || github.sha }}'

concurrency:
  group: foundry-verify-main
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  review:
    # Restrict OIDC to main, matching the immutable Entra federated credential.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FOUNDRY_PROJECT_ENDPOINT: https://registry9-claude-resource.services.ai.azure.com/api/projects/registry9-claude
      FOUNDRY_MODEL: gpt-5.6-sol
      LIVE_REQUEST_ID: ${{ inputs.live_request_id }}
      REVIEW_LIVE_SINK_URL: https://engineering-intelligence-production-a972180f.up.railway.app
      GITHUB_MCP_READONLY: '1'
      GITHUB_PERSONAL_ACCESS_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --extra quality --extra foundry
      - name: Check source and calculate source-controlled results
        run: |
          uv run --no-sync python -m ruff check solution.py pipeline.py contracts.py agentic tests
          uv run --no-sync python -m pytest
          uv run --no-sync python pipeline.py
          git diff --exit-code -- revenue_by_region.csv reports/data_quality.json
      - name: Azure login using GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: 459e0c31-5a4c-40b0-88d4-4f521ead55fc
          tenant-id: 2fcd0468-9e97-4247-a52a-a7bc870ef450
          allow-no-subscriptions: true
      - name: Verify official GitHub MCP container is available
        run: docker image inspect ghcr.io/github/github-mcp-server:v2.1.0 >/dev/null 2>&1 || docker pull ghcr.io/github/github-mcp-server:v2.1.0
      - name: Three-agent Foundry analysis
        env:
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
        run: uv run --no-sync python -m agentic.run --output agentic_review_runtime.json
      - name: Validate evidence provenance against the checked-out source
        run: uv run --no-sync python -m agentic.verify --input agentic_review_runtime.json
      - name: Export measured, redacted tool telemetry
        run: uv run --no-sync python -m agentic.telemetry_export --input agentic_review_runtime.json --output public_agent_trace.json
      - name: Validate unapproved decision proposal ledger
        run: |
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path
          from agentic.decision_ledger import DecisionLedger
          ledger = DecisionLedger.model_validate_json(
              Path("agentic_decision_ledger_runtime.json").read_text(encoding="utf-8")
          )
          assert all(d.status == "pending_human_review" for d in ledger.decisions)
          print(f"Validated {len(ledger.decisions)} unapproved, evidence-linked data decisions")
          PY
      - name: Publish verified run summary
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import os
          from pathlib import Path

          document = json.loads(Path("agentic_review_runtime.json").read_text(encoding="utf-8"))
          telemetry = json.loads(Path("public_agent_trace.json").read_text(encoding="utf-8"))
          attestation = document["deterministic_attestation"]
          assert all(attestation[key] for key in (
              "provenance_matched",
              "three_structured_agent_reports",
              "deterministic_reconciliation_confirmed",
          ))
          lines = [
              "## Foundry multiagent review",
              "",
              f"**Commit:** `{os.environ['GITHUB_SHA'][:12]}`",
              f"**Deployment:** `{document['model_deployment']}`",
              "**Source integrity:** verified against the reviewed commit",
              "**ETL reconciliation:** passed",
              f"**Measured workflow runtime:** {telemetry['wall_duration_ms']:.0f} ms",
              f"**Recorded tool calls:** {telemetry['tool_call_count']}",
              f"**Distributed OTel trace ID:** {telemetry['trace_id'] or 'not configured'}",
              "**Token usage / cost:** not measured",
              "",
              "| Independent review role | Findings | High severity |",
              "| --- | ---: | ---: |",
          ]
          for review in document["agent_reviews"]:
              findings = review["findings"]
              high = sum(1 for item in findings if item["severity"] == "high")
              lines.append(f"| {review['role']} | {len(findings)} | {high} |")
          lines.extend(["", "Model-generated findings are suggestions, not certified facts."])
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY
      - name: Upload actual agent outputs for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-agentic-review
          path: |
            agentic_review_runtime.json
            public_agent_trace.json
            agentic_decision_ledger_runtime.json
          if-no-files-found: warn
          retention-days: 90
