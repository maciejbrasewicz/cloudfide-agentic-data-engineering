name: Foundry - evidence-bound multiagent review
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Foundry and test dependencies
        run: uv sync --locked --extra quality --extra foundry
      - name: Verify deterministic ETL before AI review
        run: |
          uv run --no-sync python -m pytest
          uv run --no-sync python pipeline.py
          git diff --exit-code -- revenue_by_region.csv reports/data_quality.json
      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Three-agent analysis of verified task
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_MODEL: ${{ vars.FOUNDRY_MODEL }}
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
        run: uv run --no-sync python -m agentic.run --output agentic_review_runtime.json
      - name: Verify evidence matches current source
        run: uv run --no-sync python -m agentic.verify --input agentic_review_runtime.json
      - name: Publish review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-agentic-review
          path: agentic_review_runtime.json
          if-no-files-found: warn
          retention-days: 7
