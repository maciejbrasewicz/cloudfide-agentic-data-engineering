[project]
name = "cloudfide-agentic-data-engineering"
version = "0.1.0"
description = "Auditable pandas virtual columns and a policy-governed agentic engineering workflow"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3.0",
    "pydantic>=2.10,<3.0",
    "pandera[pandas]>=0.27,<0.30",
]

[project.optional-dependencies]
quality = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.11,<1"]
foundry = [
    "agent-framework-core==1.26.0",
    "agent-framework-foundry==1.16.2",
    "agent-framework-orchestrations==1.4.0",
    "azure-identity>=1.20,<2",
    "python-dotenv>=1,<2",
    "microsoft-opentelemetry==1.6.0",
    "mcp>=2.2,<3",
    "tenacity>=9,<10",
]

[tool.uv]
constraint-dependencies = ["agent-framework==1.26.0"]

[tool.pytest.ini_options]
testpaths = ["test_virtual_column.py", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "venv", ".git", ".pytest_cache", ".hypothesis", ".ruff_cache", "sales.csv", "reports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
